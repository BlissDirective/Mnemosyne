[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosyne-memory"
version = "0.3.0"
description = "Local-first, portable, evolutionary memory engine for AI agents (MCP)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]   # optional local embedding models (e.g. BGE-M3)

[project.scripts]
mnemosyne = "mnemosyne.cli:main"
mnemosyne-server = "mnemosyne.server:main"

[tool.setuptools.packages.find]
include = ["mnemosyne*"]
