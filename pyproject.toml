[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosyne-memory"
version = "1.1.0"
description = "Shared, governed memory for teams of AI agents from any vendor: local-first Markdown, rings and review, calibration, a hash-chained journal (MCP + HTTP)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]   # optional local embedding models (e.g. BGE-M3)
postgres = ["psycopg[binary]>=3.1"]     # storage = "postgres" (Supabase / any Postgres + pgvector)

[project.scripts]
mnemosyne = "mnemosyne.cli:main"
mnemosyne-server = "mnemosyne.server:main"
mnemosyne-gateway = "mnemosyne.gateway:main"

[tool.setuptools.packages.find]
include = ["mnemosyne*"]
