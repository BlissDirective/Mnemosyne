name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Offline test suite
        run: python -m pytest -q
      - name: Live MCP stdio check
        run: python tests/live_stdio_check.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemosyne_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # throwaway CI database, not a secret
      MNEMOSYNE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemosyne_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[postgres]" pytest
      - name: Postgres backend tests
        run: python -m pytest -q tests/test_postgres.py
      - name: Whole suite on the Postgres backend
        run: python -m pytest -q
        env:
          MNEMOSYNE_STORAGE: postgres
      - name: Live MCP stdio check on Postgres
        run: python tests/live_stdio_check.py
        env:
          MNEMOSYNE_STORAGE: postgres
          MNEMOSYNE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemosyne_test
          MNEMOSYNE_PG_SCHEMA: mnemo_live
          MNEMOSYNE_WORKSPACE: ci_live
